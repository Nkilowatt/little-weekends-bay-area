<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Little Weekends Bay Area</title>
    <meta name="description" content="오늘 아이와 갈 만한 Bay Area 나들이를 시간, 거리, 준비 정보로 빠르게 비교하세요." />
    <meta property="og:title" content="Little Weekends Bay Area" />
    <meta property="og:description" content="영유아 가족을 위한 빠르고 믿을 수 있는 Bay Area 나들이 가이드." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://little-weekends-bay-area.cashmire2.chatgpt.site/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Little Weekends Bay Area" />
    <meta name="twitter:description" content="영유아 가족을 위한 빠르고 믿을 수 있는 Bay Area 나들이 가이드." />
    <meta name="twitter:image" content="https://little-weekends-bay-area.cashmire2.chatgpt.site/og.png" />
    <link rel="icon" href="favicon.svg" />
    <link rel="preload" as="image" href="assets/photos/bay-family-hero.webp" fetchpriority="high" />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <a class="skip-link" href="#cards">추천 목록으로 건너뛰기</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="Little Weekends 홈">
          <strong>Little Weekends</strong>
          <span>Bay Area</span>
        </a>
        <nav class="top-actions" aria-label="사용자 도구">
          <button class="location-button" id="locationButton" type="button" aria-label="기준 위치 변경">
            <span class="action-label">기준 위치</span>
            <strong>San Mateo</strong>
          </button>
          <button class="saved-button" id="saveToggle" type="button" aria-pressed="false">
            <span>저장</span>
            <b id="savedCount">0</b>
          </button>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero" aria-labelledby="heroTitle">
        <div class="hero-copy">
          <p class="hero-kicker">Bay Area toddler outings</p>
          <h1 id="heroTitle">아이와 갈 곳, 10초면.</h1>
          <p class="hero-description">시간, 거리, 연령, 준비 정보를 한 화면에서 비교하세요.</p>
          <a class="hero-action" href="#discover">오늘 추천 보기</a>
        </div>
        <figure class="hero-media">
          <img src="assets/photos/bay-family-hero.webp" alt="Bay Area 해안 공원 산책로를 함께 걷는 보호자와 어린아이" width="1600" height="1067" fetchpriority="high" />
        </figure>
      </section>

      <section class="discovery" id="discover" aria-label="빠른 탐색">
        <div class="quick-heading">
          <h2>지금 우리 가족에게 맞는 조건</h2>
          <button class="search-toggle" id="searchToggle" type="button" aria-expanded="false" aria-controls="searchPanel">장소 검색</button>
        </div>

        <div class="search-panel" id="searchPanel" hidden>
          <label for="searchInput">장소 또는 활동</label>
          <input id="searchInput" type="search" placeholder="예: 스토리타임, 공원, San Mateo" />
        </div>

        <div class="quick-strip" aria-label="상황별 빠른 탐색">
          <button class="quick-card is-active" data-date="today" type="button"><strong>오늘</strong><small>바로 갈 수 있는 곳</small></button>
          <button class="quick-card" data-date="weekend" type="button"><strong>이번 주말</strong><small>가족이 함께</small></button>
          <button class="quick-card" data-date="nextweek" type="button"><strong>다음 주</strong><small id="nextWeekRange">다가오는 일정</small></button>
          <button class="quick-card" data-setting="indoor" type="button"><strong>비 오는 날</strong><small>실내에서 편하게</small></button>
          <button class="quick-card" data-price="free" type="button"><strong>무료</strong><small>비용 부담 없이</small></button>
          <button class="quick-card" data-distance="5" type="button"><strong>가까운 곳</strong><small>5마일 안쪽</small></button>
        </div>
      </section>

      <section class="results-section" aria-labelledby="summaryTitle">
        <header class="results-header">
          <div>
            <p id="summaryEyebrow">오늘의 추천</p>
            <h2 id="summaryTitle">낮잠 전에 다녀오기 좋은 가까운 곳</h2>
          </div>
          <div class="results-meta">
            <p id="resultSummary" aria-live="polite">후보를 찾고 있어요.</p>
            <p id="syncStatus" aria-live="polite">공식 일정 자동 업데이트 준비 중</p>
          </div>
        </header>

        <div class="toolbar" aria-label="결과 도구">
          <div class="view-tabs" aria-label="보기 방식">
            <button class="tab is-active" data-view="list" type="button" aria-pressed="true">목록</button>
            <button class="tab" data-view="map" type="button" aria-pressed="false">지도</button>
            <button class="tab desktop-only" data-view="split" type="button" aria-pressed="false">목록과 지도</button>
          </div>
          <button class="filter-button" id="filterButton" type="button" aria-expanded="false" aria-controls="filterPanel">필터 <b id="filterCount">0</b></button>
        </div>

        <section class="filter-panel" id="filterPanel" hidden aria-label="전체 필터">
          <div class="filter-panel-heading">
            <div><h2>조건을 더 정확하게</h2><p>필요한 조건만 선택하세요.</p></div>
            <button id="closeFilters" class="text-button" type="button">닫기</button>
          </div>
          <div class="filters">
            <label>날짜<select id="dateFilter"><option value="today">오늘</option><option value="week">이번 주</option><option value="weekend">이번 주말</option><option value="nextweek">다음 주</option><option value="anytime">언제든</option></select></label>
            <label>거리<select id="distanceFilter"><option value="25">25 mi</option><option value="10">10 mi</option><option value="5">5 mi</option><option value="3">3 mi</option></select></label>
            <label>유형<select id="typeFilter"><option value="all">전체</option><option value="storytime">스토리타임</option><option value="park">공원 및 놀이터</option><option value="indoor">실내 놀이</option><option value="museum">뮤지엄</option><option value="seasonal">시즌 이벤트</option></select></label>
            <label>환경<select id="settingFilter"><option value="all">전체</option><option value="indoor">실내</option><option value="outdoor">야외</option></select></label>
            <label>비용<select id="priceFilter"><option value="all">전체</option><option value="free">무료</option><option value="paid">유료</option></select></label>
          </div>
          <div class="filter-actions"><button class="secondary-action" id="resetFilters" type="button">전체 초기화</button><button class="primary-action" id="applyFilters" type="button"><span id="filterResultCount">0</span>개 결과 보기</button></div>
        </section>

        <section class="content-grid is-list" id="contentGrid">
          <div class="list-panel" aria-label="추천 목록">
            <div class="section-heading"><p id="listContext">San Mateo 중심, 오늘</p><select id="sortSelect" aria-label="정렬"><option value="recommended">추천순</option><option value="soonest">가까운 시간순</option><option value="nearest">거리순</option></select></div>
            <div class="cards" id="cards" aria-live="polite"></div>
          </div>
          <aside class="map-panel" aria-label="지도 보기">
            <div class="map-toolbar"><span>San Mateo 중심</span><span class="map-legend">선택한 장소가 진하게 표시됩니다</span></div>
            <div class="map-canvas" id="mapCanvas" aria-label="추천 장소가 표시된 베이 지역 지도"></div>
            <div class="map-preview" id="mapPreview" hidden></div>
          </aside>
        </section>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="모바일 주요 메뉴">
      <button class="is-active" type="button" data-mobile-action="home" aria-pressed="true"><span>홈</span></button>
      <button type="button" data-mobile-action="search" aria-pressed="false"><span>찾아보기</span></button>
      <button type="button" data-view="map" aria-pressed="false"><span>지도</span></button>
      <button type="button" data-mobile-action="saved" aria-pressed="false"><span>저장</span><b id="mobileSavedCount">0</b></button>
    </nav>

    <dialog class="detail-dialog" id="detailDialog"><button class="dialog-close" id="closeDialog" type="button" aria-label="상세 닫기">닫기</button><div id="detailBody"></div></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=10"></script>
  </body>
</html>
